<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>民营眼科PLS项目运营 JJSV工具箱</title>
<style>
:root {
  --ink:#18242b; --muted:#5b6b73; --bg:#f4f6f5; --panel:#fff; --line:#d9e3df;
  --green:#0d6b57; --green2:#128069; --blue:#245f8f; --gold:#a97828; --rose:#9e4a58;
  --shadow:0 16px 34px rgba(24,36,43,.08);
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  color:var(--ink); background:var(--bg); line-height:1.58; letter-spacing:0;
}
.shell { min-height:100vh; display:flex; flex-direction:column; }
.top { background:linear-gradient(135deg,#eef7f3 0%,#f7faf9 48%,#fff8ec 100%); border-bottom:1px solid var(--line); }
.header { max-width:1200px; margin:0 auto; padding:34px 22px 22px; }
.brand { display:flex; align-items:center; gap:12px; color:var(--green); font-weight:800; }
.logo { width:42px; height:42px; border-radius:8px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg,var(--green),var(--blue)); box-shadow:0 10px 22px rgba(13,107,87,.22); }
h1 { margin:18px 0 8px; max-width:920px; font-size:clamp(30px,4.6vw,50px); line-height:1.14; }
.subtitle { margin:0; max-width:920px; color:#3d4d55; font-size:17px; }
.toolbar { position:sticky; top:0; z-index:20; background:rgba(244,246,245,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(14px); }
.toolbar-inner { max-width:1200px; margin:0 auto; padding:12px 22px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.search { flex:1 1 280px; min-width:220px; height:42px; border:1px solid var(--line); border-radius:8px; padding:0 13px; background:#fff; color:var(--ink); font:inherit; }
.filter { height:42px; border:1px solid var(--line); border-radius:8px; padding:0 13px; background:#fff; color:var(--ink); font:inherit; font-weight:750; cursor:pointer; }
.filter.active { color:var(--green); border-color:#a9d4c7; background:#edf7f3; }
.main { max-width:1200px; width:100%; margin:0 auto; padding:22px; flex:1; }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
.metric { background:#fff; border:1px solid var(--line); border-radius:8px; padding:15px 16px; }
.metric strong { display:block; color:var(--green); font-size:25px; line-height:1.1; }
.metric span { color:var(--muted); font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
.card { min-height:188px; display:flex; flex-direction:column; gap:12px; padding:18px; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); }
.card-head { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
.card h2 { margin:0; font-size:20px; line-height:1.3; }
.badge { flex:0 0 auto; border:1px solid #cfe4dc; border-radius:7px; padding:4px 8px; color:var(--green); background:#edf7f3; font-size:12px; font-weight:800; white-space:nowrap; }
.badge.clinical { color:var(--blue); background:#eef5fb; border-color:#cfe0ef; }
.badge.operation { color:var(--gold); background:#fff7e8; border-color:#ead7b4; }
.badge.assessment { color:var(--rose); background:#fff0f2; border-color:#efd0d6; }
.desc { margin:0; color:#43535b; }
.actions { margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:12px; }
.slug { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.open { flex:0 0 auto; min-width:92px; height:38px; border:0; border-radius:8px; background:var(--green); color:white; font:inherit; font-weight:850; cursor:pointer; }
.open:hover { background:#095342; }
.empty { display:none; margin-top:18px; padding:28px; text-align:center; color:var(--muted); background:#fff; border:1px dashed var(--line); border-radius:8px; }
.footer { max-width:1200px; margin:0 auto; padding:0 22px 30px; color:var(--muted); font-size:12px; }
.viewer { position:fixed; inset:0; z-index:100; display:none; flex-direction:column; background:#fff; }
.viewer.opened { display:flex; }
.viewer-bar { flex:0 0 58px; display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); background:#f8faf9; }
.back { height:38px; border:0; border-radius:8px; padding:0 14px; background:var(--green); color:#fff; font:inherit; font-weight:850; cursor:pointer; }
.viewer-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:850; }
.frame { flex:1; width:100%; border:0; background:#fff; }
.locked .shell,
.locked .viewer { display:none; }
.auth-screen { min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(135deg,#edf7f3 0%,#f7faf9 48%,#fff8ec 100%); }
.auth-card { width:min(440px,100%); background:#fff; border:1px solid var(--line); border-radius:10px; padding:28px; box-shadow:var(--shadow); }
.auth-mark { width:46px; height:46px; border-radius:8px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg,var(--green),var(--blue)); font-weight:850; }
.auth-card h1 { margin:16px 0 8px; font-size:28px; line-height:1.2; }
.auth-card p { margin:0 0 18px; color:var(--muted); }
.auth-card label { display:block; color:var(--ink); font-weight:800; margin-bottom:8px; }
.password-row { display:flex; gap:10px; align-items:center; }
.password-row input { min-width:0; flex:1; height:44px; border:1px solid var(--line); border-radius:8px; padding:0 12px; font:inherit; }
.password-row button { flex:0 0 auto; height:44px; border:0; border-radius:8px; padding:0 16px; background:var(--green); color:#fff; font:inherit; font-weight:850; cursor:pointer; }
.password-row button:hover { background:#095342; }
.auth-error { min-height:22px; margin-top:10px; color:var(--rose); font-size:13px; font-weight:750; }
.unlocked .auth-screen { display:none; }
@media (max-width:760px) {
  .header { padding-top:28px; } .metrics,.grid { grid-template-columns:1fr; }
  .toolbar-inner { align-items:stretch; } .filter { flex:1 1 auto; }
  h1 { font-size:32px; } .card-head { display:block; } .badge { display:inline-block; margin-top:10px; }
  .password-row { display:block; }
  .password-row button { width:100%; margin-top:10px; }
}
</style>
</head>

</section>
<div class="shell">

      <h1>民营眼科PLS项目运营 JJSV工具箱</h1>

<script>
const ACCESS_PASSWORD='plsjjsv';
const authForm=document.getElementById('authForm');
const passwordInput=document.getElementById('passwordInput');
const authError=document.getElementById('authError');
authForm.addEventListener('submit',(event)=>{
  event.preventDefault();
  if(passwordInput.value===ACCESS_PASSWORD){
    document.body.classList.remove('locked');
    document.body.classList.add('unlocked');
    authError.textContent='';
    passwordInput.value='';
    return;
  }
  authError.textContent='密码不正确，请重新输入。';
  passwordInput.select();
});
const tools=JSON.parse(document.getElementById('tool-data').textContent);
const grid=document.getElementById('grid');
const search=document.getElementById('search');
const empty=document.getElementById('empty');
const viewer=document.getElementById('viewer');
const frame=document.getElementById('frame');
const viewerTitle=document.getElementById('viewerTitle');
const badgeClass=(tag)=>tag.includes('临床')?'clinical':tag.includes('运营')?'operation':tag.includes('评估')?'assessment':'';
const esc=(s)=>String(s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
grid.innerHTML=tools.map((tool)=>`<article class="card" data-slug="${esc(tool.slug)}" data-category="${esc(tool.keywords)}"><div class="card-head"><h2>${esc(tool.title)}</h2><span class="badge ${badgeClass(tool.tag)}">${esc(tool.tag)}</span></div><p class="desc">${esc(tool.desc)}</p><div class="actions"><span class="slug">${esc(tool.slug)}</span><button class="open" data-open="${esc(tool.slug)}">打开</button></div></article>`).join('');
let activeFilter='all';
function normalize(v) { return v.toLowerCase().replace(/\s+/g,''); }
function updateCards() {
  const query=normalize(search.value.trim()); let count=0;
  document.querySelectorAll('.card').forEach((card)=>{
    const tool=tools.find((item)=>item.slug===card.dataset.slug);
    const cats=card.dataset.category.split(' ');
    const text=normalize(card.textContent+' '+tool.keywords);
    const visible=(activeFilter==='all'||cats.includes(activeFilter))&&(!query||text.includes(query));
    card.style.display=visible?'':'none'; if(visible) count+=1;
  });
  empty.style.display=count?'none':'block';
}
document.querySelectorAll('.filter').forEach((button)=>button.addEventListener('click',()=>{
  document.querySelectorAll('.filter').forEach((item)=>item.classList.remove('active'));
  button.classList.add('active'); activeFilter=button.dataset.filter; updateCards();
}));
search.addEventListener('input',updateCards);
grid.addEventListener('click',(event)=>{
  const button=event.target.closest('[data-open]'); if(!button) return;
  const tool=tools.find((item)=>item.slug===button.dataset.open); if(!tool) return;
  viewerTitle.textContent=tool.title;
  frame.src='data:text/html;charset=utf-8;base64,'+tool.html64;
  viewer.classList.add('opened'); document.body.style.overflow='hidden';
});
document.getElementById('back').addEventListener('click',()=>{
  frame.removeAttribute('src'); viewer.classList.remove('opened'); document.body.style.overflow='';
});
</script>
</body>
</html>
